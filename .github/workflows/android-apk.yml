name: Build Ruediger Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "ASSET_SOURCES.md"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/RUEDIGER-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUEDIGER-v0.1-APK
          path: dist/RUEDIGER-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
