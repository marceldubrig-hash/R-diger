plugins {
    id 'com.android.application'
}

android {
    namespace 'de.ruediger.amt'
    compileSdk 35

    defaultConfig {
        applicationId "de.ruediger.amt"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("prepareRuedigerAssets") {
    doLast {
        def repoRoot = rootProject.projectDir.parentFile
        def webOut = file("$projectDir/src/main/assets/web")
        webOut.mkdirs()

        ["index.html", "styles.css", "app.js", "manifest.webmanifest", "sw.js", "ASSET_SOURCES.md"].each { name ->
            copy {
                from new File(repoRoot, name)
                into webOut
            }
        }

        def iconSource = new File(rootProject.projectDir, "app_icon.b64")
        def iconOut = file("$projectDir/src/main/res/drawable-nodpi/ruediger_icon.png")
        iconOut.parentFile.mkdirs()
        iconOut.bytes = iconSource.text.trim().decodeBase64()
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareRuedigerAssets")
}
